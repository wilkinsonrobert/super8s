<body>

<header>
    <div class="header-inner">
        <h1>SUPER 8s</h1>
        <p>Fantasy Premier League · Head-to-Head</p>
    </div>
</header>

<div class="container">

    <div id="loading" class="loading">
        Loading Super 8s...
    </div>

    <div id="site" style="display:none;">

        <div class="gameweeks" id="gameweeks"></div>

        <div id="content"></div>

    </div>

</div>

<footer>
    Super 8s - Officially taking FPL too seriously since 2013
</footer>


<script>

let data = null;
let currentGameweek = null;


/* -----------------------------
   GAMEWEEKS
----------------------------- */

function completedGameweeks() {

    return (data.completed_gameweeks || [])
        .map(Number)
        .sort((a, b) => a - b);
}


function matchesForGameweek(gameweek) {

    return (data.matches || [])
        .filter(match =>
            Number(match.event) === Number(gameweek)
        );
}


/* -----------------------------
   NAVIGATION
----------------------------- */

function renderGameweekButtons() {

    const container =
        document.getElementById("gameweeks");

    container.innerHTML = "";

    completedGameweeks().forEach(gameweek => {

        const button =
            document.createElement("button");

        button.textContent =
            `GW ${gameweek}`;

        if (gameweek === currentGameweek) {
            button.classList.add("active");
        }

        button.onclick = () => {

            currentGameweek = gameweek;

            render();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

        };

        container.appendChild(button);

    });
}


/* -----------------------------
   LEAGUE TABLE
----------------------------- */

function calculateLeagueTable(gameweek) {

    const teams = {};

    (data.teams || []).forEach(team => {

        teams[team.entry_id] = {

            entry_id: team.entry_id,

            team_name: team.team_name,

            manager: team.manager,

            played: 0,

            wins: 0,

            draws: 0,

            losses: 0,

            points: 0,

            scored: 0,

            conceded: 0

        };

    });


    (data.matches || [])
        .filter(match =>
            Number(match.event) <= Number(gameweek)
        )
        .forEach(match => {

            const home =
                teams[match.entry_1_entry];

            const away =
                teams[match.entry_2_entry];

            if (!home || !away) {
                return;
            }

            const homeScore =
                Number(match.entry_1_points);

            const awayScore =
                Number(match.entry_2_points);


            home.played++;
            away.played++;

            home.scored += homeScore;
            home.conceded += awayScore;

            away.scored += awayScore;
            away.conceded += homeScore;


            if (homeScore > awayScore) {

                home.wins++;
                home.points += 3;
                away.losses++;

            }

            else if (awayScore > homeScore) {

                away.wins++;
                away.points += 3;
                home.losses++;

            }

            else {

                home.draws++;
                away.draws++;

                home.points++;
                away.points++;

            }

        });


    return Object.values(teams)
        .sort((a, b) => {

            if (b.points !== a.points) {
                return b.points - a.points;
            }

            if (b.scored !== a.scored) {
                return b.scored - a.scored;
            }

            return (
                (b.scored - b.conceded) -
                (a.scored - a.conceded)
            );

        });

}


/* -----------------------------
   TABLE MOVEMENT
----------------------------- */

function getTableMovement(gameweek) {

    if (Number(gameweek) <= 1) {
        return {};
    }

    const current =
        calculateLeagueTable(gameweek);

    const previous =
        calculateLeagueTable(
            Number(gameweek) - 1
        );

    const previousPositions = {};

    previous.forEach((team, index) => {

        previousPositions[team.entry_id] =
            index + 1;

    });


    const movement = {};

    current.forEach((team, index) => {

        const currentPosition =
            index + 1;

        const previousPosition =
            previousPositions[team.entry_id];

        if (!previousPosition) {

            movement[team.entry_id] = {
                direction: "new",
                amount: null
            };

            return;

        }


        if (currentPosition < previousPosition) {

            movement[team.entry_id] = {
                direction: "up",
                amount:
                    previousPosition - currentPosition
            };

        }

        else if (currentPosition > previousPosition) {

            movement[team.entry_id] = {
                direction: "down",
                amount:
                    currentPosition - previousPosition
            };

        }

        else {

            movement[team.entry_id] = {
                direction: "same",
                amount: 0
            };

        }

    });


    return movement;
}


/* -----------------------------
   RESULTS
----------------------------- */

function renderResults(matches) {

    if (!matches.length) {

        return `
            <div class="card">
                <h3>Results</h3>
                <p>No matches found.</p>
            </div>
        `;

    }


    let html = `
        <div class="card">

            <h3>Results</h3>
    `;


    matches.forEach(match => {

        const homeScore =
            Number(match.entry_1_points);

        const awayScore =
            Number(match.entry_2_points);


        const homeWinner =
            homeScore > awayScore;

        const awayWinner =
            awayScore > homeScore;


        html += `

            <div class="match">

                <div class="team ${
                    homeWinner ? "winner" : ""
                }">

                    ${match.entry_1_name}

                    <div class="manager">
                        ${match.entry_1_player_name}
                    </div>

                </div>


                <div class="score">

                    ${homeScore} – ${awayScore}

                </div>


                <div class="team right ${
                    awayWinner ? "winner" : ""
                }">

                    ${match.entry_2_name}

                    <div class="manager">
                        ${match.entry_2_player_name}
                    </div>

                </div>

            </div>

        `;

    });


    html += `
        </div>
    `;

    return html;
}


/* -----------------------------
   STATISTICS
----------------------------- */

function renderStats(matches) {

    if (!matches.length) {
        return "";
    }


    const scores = [];

    matches.forEach(match => {

        scores.push({

            score:
                Number(match.entry_1_points),

            team:
                match.entry_1_name,

            manager:
                match.entry_1_player_name

        });


        scores.push({

            score:
                Number(match.entry_2_points),

            team:
                match.entry_2_name,

            manager:
                match.entry_2_player_name

        });

    });


    const highest =
        [...scores].sort(
            (a, b) => b.score - a.score
        )[0];


    const lowest =
        [...scores].sort(
            (a, b) => a.score - b.score
        )[0];


    const matchData =
        matches.map(match => ({

            match: match,

            margin:
                Math.abs(
                    Number(match.entry_1_points) -
                    Number(match.entry_2_points)
                ),

            total:
                Number(match.entry_1_points) +
                Number(match.entry_2_points)

        }));


    const biggest =
        [...matchData].sort(
            (a, b) => b.margin - a.margin
        )[0];


    const closest =
        [...matchData].sort(
            (a, b) => a.margin - b.margin
        )[0];


    return `

        <div class="stats">

            <div class="stat">

                <div class="stat-number">
                    ${highest.score}
                </div>

                <div class="stat-label">
                    Highest score
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    ${lowest.score}
                </div>

                <div class="stat-label">
                    Lowest score
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    ${biggest.margin}
                </div>

                <div class="stat-label">
                    Biggest margin
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    ${closest.margin}
                </div>

                <div class="stat-label">
                    Closest margin
                </div>

            </div>

        </div>


        <div class="card">

            <h3>Gameweek highlights</h3>


            <div class="highlight">

                <strong>Highest score:</strong>

                <span class="winner-text">
                    ${highest.team}
                </span>

                — ${highest.score}

            </div>


            <div class="highlight">

                <strong>Lowest score:</strong>

                ${lowest.team}

                — ${lowest.score}

            </div>


            <div class="highlight">

                <strong>Biggest win:</strong>

                ${
                    biggest.match.entry_1_points >
                    biggest.match.entry_2_points

                    ? `<span class="winner-text">
                        ${biggest.match.entry_1_name}
                       </span>
                       ${biggest.match.entry_1_points}–${biggest.match.entry_2_points}
                       ${biggest.match.entry_2_name}`

                    : biggest.match.entry_2_points >
                      biggest.match.entry_1_points

                    ? `${biggest.match.entry_1_name}
                       ${biggest.match.entry_1_points}–${biggest.match.entry_2_points}
                       <span class="winner-text">
                        ${biggest.match.entry_2_name}
                       </span>`

                    : `Draw:
                       ${biggest.match.entry_1_name}
                       ${biggest.match.entry_1_points}–${biggest.match.entry_2_points}
                       ${biggest.match.entry_2_name}`
                }

                — ${biggest.margin} point margin

            </div>


            <div class="highlight">

                <strong>Closest game:</strong>

                ${
                    closest.margin === 0

                    ? `${closest.match.entry_1_name}
                       ${closest.match.entry_1_points}–${closest.match.entry_2_points}
                       ${closest.match.entry_2_name}
                       — draw`

                    : closest.match.entry_1_points >
                      closest.match.entry_2_points

                    ? `<span class="winner-text">
                        ${closest.match.entry_1_name}
                       </span>
                       ${closest.match.entry_1_points}–${closest.match.entry_2_points}
                       ${closest.match.entry_2_name}`

                    : `${closest.match.entry_1_name}
                       ${closest.match.entry_1_points}–${closest.match.entry_2_points}
                       <span class="winner-text">
                        ${closest.match.entry_2_name}
                       </span>`
                }

                ${
                    closest.margin === 0
                    ? ""
                    : `— ${closest.margin} point${
                        closest.margin === 1 ? "" : "s"
                      }`
                }

            </div>

        </div>

    `;
}


/* -----------------------------
   LEAGUE TABLE
----------------------------- */

function renderLeagueTable(gameweek) {

    const teams =
        calculateLeagueTable(gameweek);

    const movement =
        getTableMovement(gameweek);


    let html = `

        <div class="card">

            <h3>
                League table after Gameweek ${gameweek}
            </h3>

            <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>#</th>
                        <th>Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>Pts</th>

                    </tr>

                </thead>

                <tbody>

    `;


    teams.forEach((team, index) => {

        const position =
            index + 1;

        const move =
            movement[team.entry_id];


        let movementHTML = "";


        if (move) {

            if (move.direction === "up") {

                movementHTML =
                    `<span class="movement-up">
                        ↑${move.amount}
                     </span>`;

            }

            else if (move.direction === "down") {

                movementHTML =
                    `<span class="movement-down">
                        ↓${move.amount}
                     </span>`;

            }

            else if (move.direction === "same") {

                movementHTML =
                    `<span class="movement-same">
                        —
                     </span>`;

            }

        }


        html += `

            <tr>

                <td class="position">

                    ${position}

                    ${movementHTML}

                </td>


                <td>

                    <div class="team-name">
                        ${team.team_name}
                    </div>

                    <div class="team-manager">
                        ${team.manager}
                    </div>

                </td>


                <td>
                    ${team.played}
                </td>

                <td>
                    ${team.wins}
                </td>

                <td>
                    ${team.draws}
                </td>

                <td>
                    ${team.losses}
                </td>

                <td class="table-points">
                    ${team.points}
                </td>

            </tr>

        `;

    });


    html += `

                </tbody>

            </table>

            </div>

        </div>

    `;


    return html;
}


/* -----------------------------
   PAGE
----------------------------- */

function render() {

    renderGameweekButtons();


    const matches =
        matchesForGameweek(
            currentGameweek
        );


    const report =
        data.weekly_reports &&
        data.weekly_reports[
            String(currentGameweek)
        ];


    let headline =
        `Gameweek ${currentGameweek}`;


    /*
       Once the automated report generator
       is added, it will provide a headline.
       Until then, we use the simple default.
    */

    if (
        report &&
        report.headline
    ) {

        headline =
            report.headline;

    }


    let html = `

        <div class="week-header">

            <div class="week-label">
                Super 8s · 2026/27
            </div>

            <h2>
                ${headline}
            </h2>

            <p>
                Gameweek ${currentGameweek}
                · ${matches.length} matches
            </p>

        </div>


        <a
            class="report-link"
            href="#"
            onclick="openMatchReport(event)"
        >

            <div>

                <div class="report-link-title">
                    Read the Gameweek ${currentGameweek} Match Report
                </div>

                <div class="report-link-subtitle">
                    The full Super 8s story
                </div>

            </div>

            <div class="report-arrow">
                →
            </div>

        </a>

    `;


    html += renderStats(matches);

    html += renderResults(matches);

    html += renderLeagueTable(
        currentGameweek
    );


    document.getElementById(
        "content"
    ).innerHTML = html;
}


/* -----------------------------
   MATCH REPORT PLACEHOLDER
----------------------------- */

function openMatchReport(event) {

    event.preventDefault();

    alert(
        "The Gameweek Match Report will appear here once the automatic report generator has been added."
    );

}


/* -----------------------------
   LOAD DATA
----------------------------- */

async function loadData() {

    try {

        const response =
            await fetch(
                "gameweek_data.json"
            );


        if (!response.ok) {

            throw new Error(
                "Could not load gameweek data."
            );

        }


        data =
            await response.json();


        const weeks =
            completedGameweeks();


        if (!weeks.length) {

            throw new Error(
                "No completed gameweeks found."
            );

        }


        /*
           Default to the latest completed
           gameweek. This means the site will
           automatically move to GW2 once GW2
           becomes completed.
        */

        currentGameweek =
            weeks[weeks.length - 1];


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "site"
        ).style.display = "block";


        render();


    }

    catch (error) {

        document.getElementById(
            "loading"
        ).innerHTML = `

            <div class="error">

                <strong>
                    Unable to load Super 8s.
                </strong>

                <br><br>

                ${error.message}

            </div>

        `;

        console.error(error);

    }

}


loadData();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super 8s</title>

<style>
:root {
    --green: #16834a;
    --green-dark: #0d6337;
    --navy: #17212b;
    --grey: #66717c;
    --light: #f4f6f8;
    --border: #dfe4e8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--light);
    color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

header {
    background: var(--navy);
    color: white;
    padding: 28px 20px;
}

.header-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

h1 {
    margin: 0;
    font-size: 34px;
}

.brand p {
    margin: 3px 0 0;
    color: #b8c1c9;
    font-size: 14px;
}

select {
    padding: 9px 13px;
    border: 0;
    border-radius: 7px;
    font-size: 15px;
}

main {
    max-width: 1100px;
    margin: 30px auto 50px;
    padding: 0 18px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
}

.top-bar h2 {
    margin: 0;
    font-size: 28px;
}

.report-link {
    background: var(--green);
    color: white;
    padding: 11px 17px;
    border-radius: 7px;
    font-weight: 700;
    text-decoration: none;
}

.report-link:hover {
    background: var(--green-dark);
}

.headline {
    background: white;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 22px;
    margin-bottom: 25px;
}

.headline h3 {
    margin: 0 0 8px;
    color: var(--green-dark);
    font-size: 22px;
}

.headline p {
    margin: 0;
    color: var(--grey);
}

.section-title {
    margin: 30px 0 12px;
    font-size: 20px;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.stat {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 17px;
}

.stat-label {
    color: var(--grey);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
}

.stat-value {
    font-size: 27px;
    font-weight: 800;
    margin-top: 4px;
}

.matches {
    display: grid;
    gap: 9px;
}

.match {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 15px 20px;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 15px;
}

.team.home {
    text-align: right;
}

.winner {
    color: var(--green);
    font-weight: 800;
}

.score {
    font-size: 21px;
    font-weight: 800;
}

.table-wrap {
    background: white;
    border: 1px solid var(--border);
    border-radius: 9px;
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: var(--navy);
    color: white;
    padding: 12px 10px;
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
}

td {
    padding: 12px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
}

tr:last-child td {
    border-bottom: 0;
}

.team-name {
    font-weight: 700;
}

.movement {
    margin-left: 5px;
    font-weight: 800;
}

.up {
    color: var(--green);
}

.down {
    color: #c83b3b;
}

.same {
    color: #a0a7ad;
}

footer {
    background: var(--navy);
    color: #aeb7bf;
    text-align: center;
    padding: 24px;
    font-size: 13px;
}

.empty {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 25px;
}

@media (max-width: 700px) {
    .header-inner,
    .top-bar {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
    }

    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    .match {
        grid-template-columns: 1fr;
        text-align: center;
    }

    .team.home {
        text-align: center;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <h1>Super 8s</h1>
            <p>FPL taken unnecessarily seriously</p>
        </div>

        <select id="gameweek"></select>
    </div>
</header>

<main>
    <div id="content">
        <div class="empty">Loading Super 8s data...</div>
    </div>
</main>

<footer>
    Super 8s - Officially taking FPL too seriously since 2013
</footer>

<script>
let data = null;
let reportData = null;

async function loadData() {

    const response = await fetch("gameweek_data.json?" + Date.now());

    if (!response.ok) {
        throw new Error("Could not load gameweek_data.json");
    }

    data = await response.json();

    try {
        const reportResponse =
            await fetch("report_data.json?" + Date.now());

        if (reportResponse.ok) {
            reportData = await reportResponse.json();
        }
    } catch (error) {
        reportData = null;
    }

    setup();
}


function setup() {

    const completed = data.completed_gameweeks || [];

    if (completed.length === 0) {
        document.getElementById("content").innerHTML =
            '<div class="empty">No completed gameweeks yet.</div>';
        return;
    }

    const selector = document.getElementById("gameweek");

    completed.sort((a, b) => a - b);

    completed.forEach(gw => {

        const option = document.createElement("option");

        option.value = gw;
        option.textContent = "Gameweek " + gw;

        selector.appendChild(option);
    });

    const latest =
        Math.max(...completed);

    selector.value = latest;

    selector.addEventListener("change", function() {
        render(Number(this.value));
    });

    render(latest);
}


function getMatches(gameweek) {

    return data.matches.filter(
        match => Number(match.event) === Number(gameweek)
    );
}


function getReport(gameweek) {

    if (!data) {
        return null;
    }

    if (!data.weekly_reports) {
        return null;
    }

    return data.weekly_reports[String(gameweek)] || null;
}


function buildTable(gameweek) {

    const teams = {};

    const matches =
        data.matches.filter(
            match => Number(match.event) <= Number(gameweek)
        );

    matches.forEach(match => {

        if (!teams[match.entry_1_entry]) {
            teams[match.entry_1_entry] = {
                id: match.entry_1_entry,
                name: match.entry_1_name,
                manager: match.entry_1_player_name,
                played: 0,
                wins: 0,
                draws: 0,
                losses: 0,
                points: 0,
                scored: 0,
                conceded: 0
            };
        }

        if (!teams[match.entry_2_entry]) {
            teams[match.entry_2_entry] = {
                id: match.entry_2_entry,
                name: match.entry_2_name,
                manager: match.entry_2_player_name,
                played: 0,
                wins: 0,
                draws: 0,
                losses: 0,
                points: 0,
                scored: 0,
                conceded: 0
            };
        }

        const home = teams[match.entry_1_entry];
        const away = teams[match.entry_2_entry];

        home.played++;
        away.played++;

        home.scored += match.entry_1_points;
        home.conceded += match.entry_2_points;

        away.scored += match.entry_2_points;
        away.conceded += match.entry_1_points;

        home.points += match.entry_1_total;
        away.points += match.entry_2_total;

        if (match.entry_1_win) {
            home.wins++;
            away.losses++;
        } else if (match.entry_2_win) {
            away.wins++;
            home.losses++;
        } else {
            home.draws++;
            away.draws++;
        }
    });

    return Object.values(teams)
        .map(team => ({
            ...team,
            difference: team.scored - team.conceded
        }))
        .sort((a, b) => {

            if (b.points !== a.points) {
                return b.points - a.points;
            }

            if (b.difference !== a.difference) {
                return b.difference - a.difference;
            }

            return b.scored - a.scored;
        });
}


function getPreviousTable(gameweek) {

    const previous =
        data.completed_gameweeks.filter(
            gw => gw < gameweek
        );

    if (!previous.length) {
        return null;
    }

    return buildTable(Math.max(...previous));
}


function render(gameweek) {

    const matches = getMatches(gameweek);
    const report = getReport(gameweek);
    const table = buildTable(gameweek);
    const previousTable = getPreviousTable(gameweek);

    if (!matches.length) {
        document.getElementById("content").innerHTML =
            '<div class="empty">No completed data for this gameweek.</div>';
        return;
    }

    const scores = [];

    matches.forEach(match => {
        scores.push(match.entry_1_points);
        scores.push(match.entry_2_points);
    });

    const highest =
        Math.max(...scores);

    const lowest =
        Math.min(...scores);

    const margins =
        matches.map(match =>
            Math.abs(
                match.entry_1_points -
                match.entry_2_points
            )
        );

    const biggest =
        Math.max(...margins);

    let html = `
        <div class="top-bar">
            <h2>Gameweek ${gameweek}</h2>
            ${
                report
                ? `<a class="report-link"
                     href="match-report.html?gw=${gameweek}">
                     Read the Gameweek ${gameweek} Match Report →
                   </a>`
                : ""
            }
        </div>
    `;

    if (report) {

        html += `
            <div class="headline">
                <h3>${safe(report.headline)}</h3>
                <p>${safe(report.introduction)}</p>
            </div>
        `;
    }

    html += `
        <h3 class="section-title">Gameweek Statistics</h3>

        <div class="stats">

            <div class="stat">
                <div class="stat-label">Matches</div>
                <div class="stat-value">${matches.length}</div>
            </div>

            <div class="stat">
                <div class="stat-label">Highest Score</div>
                <div class="stat-value">${highest}</div>
            </div>

            <div class="stat">
                <div class="stat-label">Lowest Score</div>
                <div class="stat-value">${lowest}</div>
            </div>

            <div class="stat">
                <div class="stat-label">Biggest Margin</div>
                <div class="stat-value">${biggest}</div>
            </div>

        </div>

        <h3 class="section-title">Results</h3>

        <div class="matches">
    `;

    matches.forEach(match => {

        const homeWin =
            match.entry_1_points >
            match.entry_2_points;

        const awayWin =
            match.entry_2_points >
            match.entry_1_points;

        html += `
            <div class="match">

                <div class="team home ${homeWin ? "winner" : ""}">
                    ${homeWin ? "✓ " : ""}
                    ${safe(match.entry_1_name)}
                </div>

                <div class="score">
                    ${match.entry_1_points}
                    –
                    ${match.entry_2_points}
                </div>

                <div class="team ${awayWin ? "winner" : ""}">
                    ${awayWin ? "✓ " : ""}
                    ${safe(match.entry_2_name)}
                </div>

            </div>
        `;
    });

    html += `
        </div>

        <h3 class="section-title">League Table</h3>

        <div class="table-wrap">
            <table>

                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Team</th>
                        <th>Manager</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>Pts</th>
                        <th>Diff</th>
                    </tr>
                </thead>

                <tbody>
    `;

    table.forEach((team, index) => {

        const position = index + 1;

        let movement = "";

        if (previousTable) {

            const oldIndex =
                previousTable.findIndex(
                    previous =>
                        previous.id === team.id
                );

            if (oldIndex !== -1) {

                const oldPosition =
                    oldIndex + 1;

                if (oldPosition > position) {
                    movement =
                        `<span class="movement up">
                            ▲ ${oldPosition - position}
                         </span>`;
                } else if (oldPosition < position) {
                    movement =
                        `<span class="movement down">
                            ▼ ${position - oldPosition}
                         </span>`;
                } else {
                    movement =
                        `<span class="movement same">—</span>`;
                }
            }
        }

        html += `
            <tr>

                <td>
                    <strong>${position}</strong>
                    ${movement}
                </td>

                <td class="team-name">
                    ${safe(team.name)}
                </td>

                <td>
                    ${safe(team.manager)}
                </td>

                <td>${team.played}</td>
                <td>${team.wins}</td>
                <td>${team.draws}</td>
                <td>${team.losses}</td>
                <td><strong>${team.points}</strong></td>
                <td>
                    ${team.difference >= 0 ? "+" : ""}
                    ${team.difference}
                </td>

            </tr>
        `;
    });

    html += `
                </tbody>
            </table>
        </div>
    `;

    document.getElementById("content").innerHTML = html;
}


function safe(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


loadData().catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML =
        `<div class="empty">
            Unable to load Super 8s data.<br><br>
            ${safe(error.message)}
         </div>`;
});
</script>

</body>
</html>

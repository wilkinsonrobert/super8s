<style>

    box-sizing: border-box;

<body>

<header>
    <h1>SUPER 8s</h1>
    <p>Fantasy Premier League · Head-to-Head</p>
</header>

<div class="container">

    <div id="loading" class="loading">
        Loading Super 8s...
    </div>

    <div id="site" style="display:none;">

        <div class="gameweeks" id="gameweeks"></div>

        <div id="content"></div>

    </div>

</div>

<script>

let data = null;
let currentGameweek = null;


/* -----------------------------
   Basic helpers
----------------------------- */

function completedGameweeks() {

    return (data.completed_gameweeks || [])
        .map(Number)
        .sort((a, b) => a - b);
}


function matchesForGameweek(gameweek) {

    return (data.matches || [])
        .filter(match => Number(match.event) === Number(gameweek));
}


/* -----------------------------
   Gameweek navigation
----------------------------- */

function renderGameweekButtons() {

    const container =
        document.getElementById("gameweeks");

    container.innerHTML = "";

    completedGameweeks().forEach(gameweek => {

        const button =
            document.createElement("button");

        button.textContent =
            `GW ${gameweek}`;

        if (gameweek === currentGameweek) {
            button.classList.add("active");
        }

        button.onclick = () => {
            currentGameweek = gameweek;
            render();
        };

        container.appendChild(button);
    });
}


/* -----------------------------
   League table
----------------------------- */

function calculateLeagueTable(gameweek) {

    const teams = {};

    (data.teams || []).forEach(team => {

        teams[team.entry_id] = {
            entry_id: team.entry_id,
            team_name: team.team_name,
            manager: team.manager,
            played: 0,
            wins: 0,
            draws: 0,
            losses: 0,
            points: 0,
            scored: 0,
            conceded: 0
        };

    });


    (data.matches || [])
        .filter(match =>
            Number(match.event) <= Number(gameweek)
        )
        .forEach(match => {

            const home =
                teams[match.entry_1_entry];

            const away =
                teams[match.entry_2_entry];

            if (!home || !away) {
                return;
            }

            const homeScore =
                Number(match.entry_1_points);

            const awayScore =
                Number(match.entry_2_points);

            home.played++;
            away.played++;

            home.scored += homeScore;
            home.conceded += awayScore;

            away.scored += awayScore;
            away.conceded += homeScore;


            if (homeScore > awayScore) {

                home.wins++;
                home.points += 3;
                away.losses++;

            } else if (awayScore > homeScore) {

                away.wins++;
                away.points += 3;
                home.losses++;

            } else {

                home.draws++;
                away.draws++;

                home.points++;
                away.points++;

            }

        });


    return Object.values(teams)
        .sort((a, b) => {

            if (b.points !== a.points) {
                return b.points - a.points;
            }

            if (b.scored !== a.scored) {
                return b.scored - a.scored;
            }

            return (
                (b.scored - b.conceded) -
                (a.scored - a.conceded)
            );

        });
}


/* -----------------------------
   Results
----------------------------- */

function renderResults(matches) {

    if (!matches.length) {
        return `
            <div class="card">
                No matches found.
            </div>
        `;
    }


    let html = `
        <div class="card">
            <h3>Results</h3>
    `;


    matches.forEach(match => {

        const homeScore =
            Number(match.entry_1_points);

        const awayScore =
            Number(match.entry_2_points);

        const homeClass =
            homeScore > awayScore
            ? "winner"
            : "";

        const awayClass =
            awayScore > homeScore
            ? "winner"
            : "";


        html += `
            <div class="match">

                <div class="team ${homeClass}">
                    ${match.entry_1_name}
                    <div class="manager">
                        ${match.entry_1_player_name}
                    </div>
                </div>

                <div class="score">
                    ${homeScore} – ${awayScore}
                </div>

                <div class="team right ${awayClass}">
                    ${match.entry_2_name}
                    <div class="manager">
                        ${match.entry_2_player_name}
                    </div>
                </div>

            </div>
        `;

    });


    html += `</div>`;

    return html;
}


/* -----------------------------
   League table
----------------------------- */

function renderLeagueTable(gameweek) {

    const teams =
        calculateLeagueTable(gameweek);


    let html = `
        <div class="card">

            <h3>
                League table after Gameweek ${gameweek}
            </h3>

            <div style="overflow-x:auto;">

            <table>

                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>Pts</th>
                    </tr>
                </thead>

                <tbody>
    `;


    teams.forEach((team, index) => {

        html += `
            <tr>

                <td class="position">
                    ${index + 1}
                </td>

                <td>
                    <strong>
                        ${team.team_name}
                    </strong>

                    <div class="small">
                        ${team.manager}
                    </div>
                </td>

                <td>${team.played}</td>
                <td>${team.wins}</td>
                <td>${team.draws}</td>
                <td>${team.losses}</td>

                <td class="points">
                    ${team.points}
                </td>

            </tr>
        `;

    });


    html += `
                </tbody>

            </table>

            </div>

        </div>
    `;

    return html;
}


/* -----------------------------
   Weekly statistics
----------------------------- */

function renderStats(gameweek, matches) {

    const scores = [];

    matches.forEach(match => {

        scores.push({
            score: Number(match.entry_1_points),
            team: match.entry_1_name,
            manager: match.entry_1_player_name
        });

        scores.push({
            score: Number(match.entry_2_points),
            team: match.entry_2_name,
            manager: match.entry_2_player_name
        });

    });


    if (!scores.length) {
        return "";
    }


    const highest =
        [...scores].sort(
            (a, b) => b.score - a.score
        )[0];

    const lowest =
        [...scores].sort(
            (a, b) => a.score - b.score
        )[0];


    const matchData =
        matches.map(match => ({

            match,

            margin: Math.abs(
                Number(match.entry_1_points) -
                Number(match.entry_2_points)
            ),

            total:
                Number(match.entry_1_points) +
                Number(match.entry_2_points)

        }));


    const biggest =
        [...matchData].sort(
            (a, b) => b.margin - a.margin
        )[0];

    const closest =
        [...matchData].sort(
            (a, b) => a.margin - b.margin
        )[0];

    const highestMatch =
        [...matchData].sort(
            (a, b) => b.total - a.total
        )[0];


    return `
        <div class="card">

            <h3>Gameweek statistics</h3>

            <div class="highlight">
                <strong>Highest score:</strong>
                ${highest.score}
                — ${highest.team}
                <span class="small">
                    (${highest.manager})
                </span>
            </div>

            <div class="highlight">
                <strong>Lowest score:</strong>
                ${lowest.score}
                — ${lowest.team}
                <span class="small">
                    (${lowest.manager})
                </span>
            </div>

            <div class="highlight">
                <strong>Biggest win:</strong>
                ${biggest.margin} points —
                ${biggest.match.entry_1_name}
                ${biggest.match.entry_1_points}–${biggest.match.entry_2_points}
                ${biggest.match.entry_2_name}
            </div>

            <div class="highlight">
                <strong>Closest game:</strong>
                ${closest.match.entry_1_name}
                ${closest.match.entry_1_points}–${closest.match.entry_2_points}
                ${closest.match.entry_2_name}
                ${
                    closest.margin === 0
                    ? "— draw"
                    : `— ${closest.margin} point margin`
                }
            </div>

            <div class="highlight">
                <strong>Highest-scoring match:</strong>
                ${highestMatch.match.entry_1_name}
                ${highestMatch.match.entry_1_points}–${highestMatch.match.entry_2_points}
                ${highestMatch.match.entry_2_name}
                — ${highestMatch.total} points combined
            </div>

        </div>
    `;
}


/* -----------------------------
   Main page
----------------------------- */

function render() {

    renderGameweekButtons();


    const matches =
        matchesForGameweek(currentGameweek);


    const report =
        data.weekly_reports &&
        data.weekly_reports[String(currentGameweek)];


    let html = `

        <div class="card">

            <h2>
                Super 8s — Gameweek ${currentGameweek}
            </h2>

            <div class="subtitle">
                ${matches.length} matches
            </div>

        </div>
    `;


    html += renderStats(
        currentGameweek,
        matches
    );


    html += renderResults(
        matches
    );


    html += renderLeagueTable(
        currentGameweek
    );


    /*
       If the report later contains
       written commentary, we'll display
       it here.
    */

    if (report && report.commentary) {

        html += `
            <div class="card">

                <h3>
                    The Super 8s Weekly
                </h3>

                <div>
                    ${report.commentary}
                </div>

            </div>
        `;

    }


    document.getElementById(
        "content"
    ).innerHTML = html;
}


/* -----------------------------
   Load data
----------------------------- */

async function loadData() {

    try {

        const response =
            await fetch(
                "gameweek_data.json"
            );


        if (!response.ok) {
            throw new Error(
                "Could not load gameweek data."
            );
        }


        data =
            await response.json();


        const weeks =
            completedGameweeks();


        if (!weeks.length) {
            throw new Error(
                "No completed gameweeks found."
            );
        }


        currentGameweek =
            weeks[weeks.length - 1];


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "site"
        ).style.display = "block";


        render();


    } catch (error) {

        document.getElementById(
            "loading"
        ).innerHTML = `
            <div class="error">
                <strong>
                    Unable to load Super 8s.
                </strong>

                <br><br>

                ${error.message}
            </div>
        `;

        console.error(error);

    }

}


loadData();

</script>

</body>
</html>

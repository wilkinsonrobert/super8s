name: Test FPL Data Collection

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  test-fpl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: pip install requests openai

      - name: Run FPL data collection
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python fpl_data.py

      - name: Analyse Super 8s data
        run: python report_data.py

      - name: Show collected data
        run: |
          echo "===== GAMEWEEK DATA ====="
          head -100 gameweek_data.json

          echo "===== REPORT DATA ====="
          head -200 report_data.json

      - name: Save collected data
        run: |
          git config user.name "Super 8s Bot"
          git config user.email "actions@github.com"
          git add gameweek_data.json report_data.json
          git diff --cached --quiet || git commit -m "Update Super 8s data"
          git push

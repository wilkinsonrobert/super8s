<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super 8s Match Report</title>

<style>
:root {
    --green: #16834a;
    --green-dark: #0d6337;
    --navy: #17212b;
    --grey: #66717c;
    --light: #f4f6f8;
    --border: #dfe4e8;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--light);
    color: var(--navy);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

header {
    background: var(--navy);
    color: white;
    padding: 28px 20px;
}

.header-inner {
    max-width: 900px;
    margin: auto;
}

h1 {
    margin: 0;
    font-size: 32px;
}

header p {
    margin: 5px 0 0;
    color: #b8c1c9;
    font-size: 14px;
}

main {
    max-width: 900px;
    margin: 30px auto 50px;
    padding: 0 18px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: var(--green-dark);
    font-weight: 700;
    text-decoration: none;
}

.report {
    background: white;
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 30px;
}

.report h2 {
    margin: 0 0 12px;
    color: var(--green-dark);
    font-size: 30px;
}

.introduction {
    color: var(--grey);
    font-size: 17px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.section-title {
    margin: 32px 0 15px;
    font-size: 22px;
    border-bottom: 2px solid var(--border);
    padding-bottom: 8px;
}

.match-report {
    margin-bottom: 25px;
}

.match-report h3 {
    margin: 0 0 8px;
    font-size: 19px;
}

.match-report p,
.table-commentary,
.closing,
.preview-text,
.award-text {
    line-height: 1.65;
    color: #303b44;
}

.award {
    border-left: 4px solid var(--green);
    padding: 12px 16px;
    margin-bottom: 15px;
    background: var(--light);
}

.award-name {
    font-weight: 800;
    color: var(--green-dark);
}

.award-winner {
    font-weight: 700;
}

.preview-item {
    margin-bottom: 18px;
}

.preview-fixture {
    font-weight: 800;
    font-size: 17px;
}

.empty {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 25px;
}

footer {
    background: var(--navy);
    color: #aeb7bf;
    text-align: center;
    padding: 24px;
    font-size: 13px;
}

@media (max-width: 700px) {
    .report {
        padding: 20px;
    }

    .report h2 {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1>Super 8s</h1>
        <p>FPL taken unnecessarily seriously</p>
    </div>
</header>

<main>

    <a class="back" href="index.html">← Back to Gameweek</a>

    <div id="content">
        <div class="empty">Loading match report...</div>
    </div>

</main>

<footer>
    Super 8s - Officially taking FPL too seriously since 2013
</footer>

<script>

let data = null;

function safe(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadData() {

    const response =
        await fetch(
            "gameweek_data.json?" + Date.now()
        );

    if (!response.ok) {
        throw new Error(
            "Could not load gameweek_data.json"
        );
    }

    data = await response.json();

    render();
}


function render() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const gameweek =
        params.get("gw");

    if (!gameweek) {

        document.getElementById("content").innerHTML =
            '<div class="empty">No gameweek specified.</div>';

        return;
    }

    if (!data.weekly_reports) {

        document.getElementById("content").innerHTML =
            '<div class="empty">No match reports are currently available.</div>';

        return;
    }

    const report =
        data.weekly_reports[String(gameweek)];

    if (!report) {

        document.getElementById("content").innerHTML =
            `<div class="empty">
                No match report is available for Gameweek ${safe(gameweek)}.
             </div>`;

        return;
    }

    let html = `

        <article class="report">

            <h2>${safe(report.headline)}</h2>

            <div class="introduction">
                ${safe(report.introduction)}
            </div>

            <h3 class="section-title">
                Match Reports
            </h3>
    `;


    if (report.matches &&
        report.matches.length) {

        report.matches.forEach(match => {

            html += `
                <div class="match-report">

                    <h3>
                        ${safe(match.title)}
                    </h3>

                    <p>
                        ${safe(match.text)}
                    </p>

                </div>
            `;

        });

    }


    if (report.awards &&
        report.awards.length) {

        html += `
            <h3 class="section-title">
                Weekly Awards
            </h3>
        `;

        report.awards.forEach(award => {

            html += `
                <div class="award">

                    <div class="award-name">
                        ${safe(award.award)}
                    </div>

                    <div class="award-winner">
                        ${safe(award.winner)}
                    </div>

                    <div class="award-text">
                        ${safe(award.text)}
                    </div>

                </div>
            `;

        });

    }


    if (report.table_commentary) {

        html += `

            <h3 class="section-title">
                League Table
            </h3>

            <div class="table-commentary">
                ${safe(report.table_commentary)}
            </div>
        `;
    }


    if (report.preview &&
        report.preview.length) {

        html += `

            <h3 class="section-title">
                Next Gameweek
            </h3>
        `;

        report.preview.forEach(item => {

            html += `
                <div class="preview-item">

                    <div class="preview-fixture">
                        ${safe(item.fixture)}
                    </div>

                    <div class="preview-text">
                        ${safe(item.text)}
                    </div>

                </div>
            `;

        });

    }


    if (report.closing) {

        html += `

            <h3 class="section-title">
                Closing Thoughts
            </h3>

            <div class="closing">
                ${safe(report.closing)}
            </div>
        `;
    }


    html += `
        </article>
    `;


    document.getElementById("content").innerHTML = html;
}


loadData().catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML =
        `<div class="empty">
            Unable to load the match report.<br><br>
            ${safe(error.message)}
         </div>`;
});

</script>

</body>
</html>

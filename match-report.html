<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super 8s Match Report</title>

<style>
:root {
    --navy: #101c2b;
    --navy-light: #18283b;
    --gold: #d4a62a;
    --gold-light: #f1d77b;
    --cream: #f7f5ef;
    --white: #ffffff;
    --text: #202a35;
    --grey: #68727d;
    --border: #e3e0d7;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: var(--cream);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
}

/* HEADER */

header {
    background: var(--navy);
    color: white;
    padding: 26px 20px 24px;
    border-bottom: 4px solid var(--gold);
}

.header-inner {
    max-width: 1000px;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.brand h1 {
    margin: 0;
    font-size: 34px;
    letter-spacing: -0.5px;
}

.brand p {
    margin: 4px 0 0;
    color: #b8c2cc;
    font-size: 14px;
}

/* MAIN */

main {
    max-width: 1000px;
    margin: 28px auto 55px;
    padding: 0 18px;
}

/* BACK BUTTON */

.back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 20px;
    padding: 9px 14px;
    background: var(--navy);
    color: white;
    border-radius: 7px;
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.15s ease;
}

.back:hover {
    background: var(--navy-light);
}

/* REPORT HEADER */

.report-header {
    background: var(--navy);
    color: white;
    border-radius: 12px;
    padding: 32px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
}

.report-header::after {
    content: "";
    position: absolute;
    right: -45px;
    top: -45px;
    width: 150px;
    height: 150px;
    border: 3px solid rgba(212, 166, 42, 0.35);
    border-radius: 50%;
}

.report-kicker {
    color: var(--gold-light);
    font-size: 12px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 1.4px;
    margin-bottom: 9px;
}

.report-header h2 {
    margin: 0;
    font-size: 31px;
    line-height: 1.2;
    max-width: 800px;
}

.introduction {
    margin-top: 17px;
    color: #d7dde3;
    font-size: 17px;
    line-height: 1.65;
    max-width: 850px;
}

/* SECTIONS */

.section {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 11px;
    padding: 25px 28px;
    margin-bottom: 18px;
}

.section-title {
    margin: 0 0 20px;
    padding-bottom: 11px;
    border-bottom: 2px solid var(--gold);
    color: var(--navy);
    font-size: 21px;
}

/* MATCHES */

.match-report {
    padding: 0 0 22px;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--border);
}

.match-report:last-child {
    padding-bottom: 0;
    margin-bottom: 0;
    border-bottom: 0;
}

.match-report h3 {
    margin: 0 0 9px;
    color: var(--navy);
    font-size: 18px;
}

.match-report p {
    margin: 0;
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
}

/* AWARDS */

.award {
    background: var(--cream);
    border: 1px solid var(--border);
    border-left: 5px solid var(--gold);
    border-radius: 7px;
    padding: 15px 17px;
    margin-bottom: 13px;
}

.award:last-child {
    margin-bottom: 0;
}

.award-name {
    color: var(--navy);
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: .6px;
}

.award-winner {
    margin-top: 3px;
    color: var(--gold);
    font-size: 17px;
    font-weight: 800;
}

.award-text {
    margin-top: 7px;
    color: var(--text);
    line-height: 1.6;
    font-size: 15px;
}

/* TABLE COMMENTARY */

.table-commentary,
.closing {
    color: var(--text);
    line-height: 1.7;
    font-size: 15px;
}

/* PREVIEW */

.preview-item {
    padding: 15px 0;
    border-bottom: 1px solid var(--border);
}

.preview-item:first-of-type {
    padding-top: 0;
}

.preview-item:last-child {
    border-bottom: 0;
    padding-bottom: 0;
}

.preview-fixture {
    color: var(--navy);
    font-size: 17px;
    font-weight: 800;
    margin-bottom: 6px;
}

.preview-text {
    color: var(--text);
    line-height: 1.65;
    font-size: 15px;
}

/* EMPTY */

.empty {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 25px;
}

/* FOOTER */

footer {
    background: var(--navy);
    color: #aeb7bf;
    text-align: center;
    padding: 25px;
    font-size: 13px;
    border-top: 4px solid var(--gold);
}

/* MOBILE */

@media (max-width: 700px) {

    header {
        padding: 22px 18px;
    }

    .brand h1 {
        font-size: 29px;
    }

    main {
        margin-top: 22px;
        padding: 0 13px;
    }

    .report-header {
        padding: 25px 21px;
    }

    .report-header h2 {
        font-size: 25px;
    }

    .introduction {
        font-size: 16px;
    }

    .section {
        padding: 21px 18px;
    }

    .section-title {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <h1>Super 8s</h1>
            <p>FPL taken unnecessarily seriously</p>
        </div>
    </div>
</header>

<main>

    <a class="back" href="index.html">← Back to Gameweek</a>

    <div id="content">
        <div class="empty">Loading match report...</div>
    </div>

</main>

<footer>
    Super 8s — Officially taking FPL too seriously since 2013
</footer>

<script>

let data = null;

function safe(value) {

    if (value === null ||
        value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


async function loadData() {

    const response =
        await fetch(
            "gameweek_data.json?" + Date.now()
        );

    if (!response.ok) {
        throw new Error(
            "Could not load gameweek_data.json"
        );
    }

    data = await response.json();

    render();
}


function render() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const gameweek =
        params.get("gw");

    if (!gameweek) {

        document.getElementById("content").innerHTML =
            '<div class="empty">No gameweek specified.</div>';

        return;
    }

    if (!data.weekly_reports) {

        document.getElementById("content").innerHTML =
            '<div class="empty">No match reports are currently available.</div>';

        return;
    }

    const report =
        data.weekly_reports[String(gameweek)];

    if (!report) {

        document.getElementById("content").innerHTML =
            `<div class="empty">
                No match report is available for Gameweek ${safe(gameweek)}.
             </div>`;

        return;
    }

    let html = `

        <div class="report-header">

            <div class="report-kicker">
                Gameweek ${safe(gameweek)} Match Report
            </div>

            <h2>
                ${safe(report.headline)}
            </h2>

            <div class="introduction">
                ${safe(report.introduction)}
            </div>

        </div>
    `;


    if (report.matches &&
        report.matches.length) {

        html += `

            <section class="section">

                <h3 class="section-title">
                    Match Reports
                </h3>
        `;

        report.matches.forEach(match => {

            html += `
                <div class="match-report">

                    <h3>
                        ${safe(match.title)}
                    </h3>

                    <p>
                        ${safe(match.text)}
                    </p>

                </div>
            `;

        });

        html += `
            </section>
        `;
    }


    if (report.awards &&
        report.awards.length) {

        html += `

            <section class="section">

                <h3 class="section-title">
                    Weekly Awards
                </h3>
        `;

        report.awards.forEach(award => {

            html += `
                <div class="award">

                    <div class="award-name">
                        ${safe(award.award)}
                    </div>

                    <div class="award-winner">
                        ${safe(award.winner)}
                    </div>

                    <div class="award-text">
                        ${safe(award.text)}
                    </div>

                </div>
            `;

        });

        html += `
            </section>
        `;
    }


    if (report.table_commentary) {

        html += `

            <section class="section">

                <h3 class="section-title">
                    League Table
                </h3>

                <div class="table-commentary">
                    ${safe(report.table_commentary)}
                </div>

            </section>
        `;
    }


    if (report.preview &&
        report.preview.length) {

        html += `

            <section class="section">

                <h3 class="section-title">
                    Next Gameweek
                </h3>
        `;

        report.preview.forEach(item => {

            html += `
                <div class="preview-item">

                    <div class="preview-fixture">
                        ${safe(item.fixture)}
                    </div>

                    <div class="preview-text">
                        ${safe(item.text)}
                    </div>

                </div>
            `;

        });

        html += `
            </section>
        `;
    }


    if (report.closing) {

        html += `

            <section class="section">

                <h3 class="section-title">
                    Closing Thoughts
                </h3>

                <div class="closing">
                    ${safe(report.closing)}
                </div>

            </section>
        `;
    }


    document.getElementById("content").innerHTML = html;
}


loadData().catch(error => {

    console.error(error);

    document.getElementById("content").innerHTML =
        `<div class="empty">
            Unable to load the match report.<br><br>
            ${safe(error.message)}
         </div>`;
});

</script>

</body>
</html>
